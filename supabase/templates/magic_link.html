<!doctype html>
<!--
  The Studio sign-in code. Mail apps need tables, inline styles and literal
  colours: no theme tokens reach an inbox. Images are PNGs
  served by Studio at {{ .SiteURL }} (the Hub's site_url), from
  packages/ui's `brand` script. Applied to the Hub by every Hub deploy.
-->
<html lang="en">
  <!-- ds-allow-hardcode:start (email: inline literal colours only) -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>Your Studio code</title>
    <style>
      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
      }
      @media (prefers-color-scheme: dark) {
        .page {
          background: #09090b !important;
        }
        .card {
          background: #18181b !important;
          border-color: #27272a !important;
        }
        .text {
          color: #fafafa !important;
        }
        .muted {
          color: #a1a1aa !important;
        }
        .code {
          background: #27272a !important;
          color: #fafafa !important;
        }
        .rule {
          border-color: #27272a !important;
        }
      }
    </style>
  </head>
  <body
    class="page"
    style="
      margin: 0;
      padding: 0;
      background: #f4f4f5;
      -webkit-text-size-adjust: 100%;
    "
  >
    <!-- What the inbox shows under the subject. -->
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0">
      Type {{ .Token }} in Studio. It works once, for an hour.
    </div>
    <table
      role="presentation"
      class="page"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f4f4f5"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            class="card"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 440px;
              background: #ffffff;
              border: 1px solid #e4e4e7;
              border-radius: 16px;
            "
          >
            <tr>
              <td
                style="
                  padding: 32px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                    Roboto, Helvetica, Arial, sans-serif;
                "
              >
                <img
                  src="{{ .SiteURL }}/email/ditherbooth.png"
                  width="48"
                  height="48"
                  alt="Dither Booth"
                  style="display: block; border: 0; border-radius: 12px"
                />
                <h1
                  class="text"
                  style="
                    margin: 24px 0 8px;
                    font-size: 22px;
                    line-height: 28px;
                    font-weight: 600;
                    color: #09090b;
                  "
                >
                  Your Studio code
                </h1>
                <p
                  class="muted"
                  style="
                    margin: 0 0 24px;
                    font-size: 15px;
                    line-height: 22px;
                    color: #52525b;
                  "
                >
                  Type it in Dither Booth Studio to sign in.
                </p>
                <div
                  class="code"
                  style="
                    padding: 16px 16px 16px 24px;
                    background: #f4f4f5;
                    border-radius: 12px;
                    text-align: center;
                    font-family:
                      ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                    font-size: 32px;
                    line-height: 40px;
                    font-weight: 600;
                    letter-spacing: 8px;
                    color: #09090b;
                  "
                >
                  {{ .Token }}
                </div>
                <p
                  class="muted"
                  style="
                    margin: 16px 0 0;
                    font-size: 14px;
                    line-height: 20px;
                    color: #52525b;
                  "
                >
                  It works once, for an hour.
                </p>
                <hr
                  class="rule"
                  style="
                    margin: 24px 0;
                    border: 0;
                    border-top: 1px solid #e4e4e7;
                  "
                />
                <p
                  class="muted"
                  style="
                    margin: 0;
                    font-size: 13px;
                    line-height: 20px;
                    color: #71717a;
                  "
                >
                  Didn't ask for it? Ignore this email. No one can sign in
                  to {{ .Email }} without the code.
                </p>
              </td>
            </tr>
          </table>
          <table role="presentation" cellpadding="0" cellspacing="0">
            <tr>
              <td style="padding-top: 24px">
                <img
                  src="{{ .SiteURL }}/email/99stud.png"
                  height="20"
                  alt=""
                  style="display: block; border: 0; height: 20px; width: auto"
                />
              </td>
              <td
                class="muted"
                style="
                  padding: 24px 0 0 8px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                    Roboto, Helvetica, Arial, sans-serif;
                  font-size: 12px;
                  line-height: 20px;
                  color: #71717a;
                "
              >
                Powered by 99Stud
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
  <!-- ds-allow-hardcode:end -->
</html>
