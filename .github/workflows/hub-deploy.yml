name: Hub deploy

# Ships the Hub to its Supabase project once the Hub checks pass on main:
# migrations first, then the Edge Functions, so a function never runs against
# a schema it doesn't know, then the project's settings from
# supabase/config.toml (Auth, with the sign-in email). It only runs when the
# Hub workflow ran, that is when something under supabase/ or
# packages/protocol/ changed.
#
# Needs, in the `production` environment (or the repository):
# - secret SUPABASE_ACCESS_TOKEN: a personal access token scoped to the Hub's
#   project only, with Read on Project Settings, API Keys, API Key Secrets and
#   Connection Pooling, and Read-write on Edge Functions and Auth (for
#   `config push`)
# - secret SUPABASE_DB_PASSWORD: the project's database password
# - variable SUPABASE_PROJECT_ID: the project ref
on:
  workflow_run:
    workflows: [Hub]
    types: [completed]
    branches: [main]
  # Re-deploys main by hand, for instance after rotating a secret.
  workflow_dispatch:

# One deploy at a time, and never cancelled halfway through a migration.
concurrency:
  group: hub-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    # A push to main whose checks passed, or a manual run from main.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      # The commit the checks ran on, not whatever main is by now.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.98.2

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Runners have no IPv6 and the database's own host has nothing else, so
      # migrations go through the pooler. Without Connection Pooling: Read,
      # `link` skips the pooler without a word and `db push` fails later on
      # an IPv6 address: say what is missing here instead.
      - name: Check the pooler is reachable
        run: |
          if [ ! -s supabase/.temp/pooler-url ]; then
            echo "::error::supabase link found no pooler URL. Give SUPABASE_ACCESS_TOKEN Connection Pooling: Read."
            exit 1
          fi

      - name: Migrations to apply
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push --yes

      # Bundled with Docker (the CLI's default), which reads the repo as
      # `supabase functions serve` does: the functions import
      # packages/protocol from outside supabase/functions.
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      # supabase/config.toml as code (what Supabase recommends for email
      # templates), with [remotes.production] in place of the local values:
      # the log shows the diff it applies. Last, so a schema or function
      # failure never leaves new settings behind.
      - name: Push the project settings
        run: supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes
