name: Hub

# The Hub's migrations, their RLS tests and its Edge Functions, run only when
# `supabase/` or the protocol it reads changes, so the main CI stays fast.
# Locally: `supabase start && supabase test db`, and `deno test` in
# supabase/functions.
on:
  pull_request:
    paths:
      - "supabase/**"
      - "packages/protocol/**"
      - ".github/workflows/hub.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "packages/protocol/**"
      - ".github/workflows/hub.yml"
  workflow_dispatch:

concurrency:
  group: hub-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.98.2

      # Auth is in: the tests insert into auth.users. Nothing else is needed
      # to test SQL, so the rest of the stack stays off.
      - name: Start the local database
        run: supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # Only the schema we own: pgTAP's functions in `extensions` trip the
      # linter once the tests have installed it.
      - name: Lint the database
        run: supabase db lint --local --schema public --fail-on error

      - name: Test the database
        run: supabase test db

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck the heartbeat function
        working-directory: supabase/functions
        run: deno check --config heartbeat/deno.json heartbeat/index.ts

      - name: Test the heartbeat function
        working-directory: supabase/functions
        run: deno test --config heartbeat/deno.json heartbeat/
