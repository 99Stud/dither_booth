<!doctype html>
<html lang="en" class="saas">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dither Booth" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#09090b"
      media="(prefers-color-scheme: dark)"
    />
    <title>Dither Booth · Admin</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before the first paint, so dark mode never
      // flashes white. next-themes takes over once React mounts.
      try {
        const saved = localStorage.getItem("dither-booth.admin-theme");
        const dark =
          saved === "dark" ||
          ((saved === null || saved === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
