<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig used by the receipt viewer Chromium on the booth (Linux only).
  The printer is 1-bit, so anti-aliased text only adds gray fringes that have
  to be dithered away. Rendering glyphs without anti-aliasing but with full
  hinting makes the screenshot mostly pure black and white from the start.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
