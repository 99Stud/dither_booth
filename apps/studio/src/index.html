<!doctype html>
<html lang="en" class="saas">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Studio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- ds-allow-hardcode:start: a meta tag can't read a CSS token -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#09090b"
      media="(prefers-color-scheme: dark)"
    />
    <!-- ds-allow-hardcode:end -->
    <meta name="color-scheme" content="light dark" />
    <title>Dither Booth Studio</title>
    <script>
      // The system's theme before the first paint, so dark mode never
      // flashes white. next-themes takes over once React mounts.
      try {
        if (matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Until the app renders the splash in its place: the splash's
           background (BRAND_ICON_BACKGROUND, the manifest's
           background_color), so the launch screen holds while it loads. -->
      <!-- ds-allow-hardcode:start: paints before any stylesheet loads -->
      <div style="position: fixed; inset: 0; background: #09090b"></div>
      <!-- ds-allow-hardcode:end -->
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
